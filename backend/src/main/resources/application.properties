spring.application.name=gestion-biblioteca

# Puerto
server.port=${PORT:8080}

# ============================================================
# BASE DE DATOS
# ============================================================
# En local usa H2.
# En la nube, si existe DB_URL, utiliza PostgreSQL.

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/biblioteca;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# H2
# ============================================================
# Se puede usar localmente.
# En producción podemos desactivarla desde las variables
# de entorno.

spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# ============================================================
# USUARIO ADMINISTRADOR INICIAL
# ============================================================
# Solo se crea si la base esta vacia.
# En local usan estos valores por defecto; en produccion las
# variables de entorno APP_ADMIN_USERNAME / APP_ADMIN_PASSWORD
# los sobrescriben.

app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}

# ============================================================
# JWT
# ============================================================
# En producción define JWT_SECRET como variable de entorno con
# una clave larga y única. El valor por defecto es SOLO para
# desarrollo local.

jwt.secret=${JWT_SECRET:BibliotecaClaveLocalDesarrollo2026NoUsarEnProduccion1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}