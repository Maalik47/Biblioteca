spring.application.name=gestion-biblioteca
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Base de datos
#   - Local (por defecto): H2 en archivo, no requiere instalar nada.
#   - Nube (Railway / Fly.io / Koyeb): definir las variables de entorno
#       DB_URL=jdbc:postgresql://HOST:5432/basededatos
#       DB_USER=usuario
#       DB_PASSWORD=clave
#     Spring usa PostgreSQL automaticamente cuando DB_URL esta definida.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/biblioteca;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Driver y dialecto se detectan automaticamente segun la URL (H2 o PostgreSQL)

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Consola H2: solo habilitada cuando se usa H2
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# JWT
#   En produccion: JWT_SECRET=<clave de al menos 32 caracteres>
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:BibliotecaSuperSecretaClaveParaFirmarTokensJWT2026#Seguridad}
jwt.expiration=${JWT_EXPIRATION:86400000}
