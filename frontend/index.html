<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Biblioteca</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div class="login-fondo">
        <div class="login-tarjeta">
            <div class="login-marca">
                <div class="login-logo" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                    </svg>
                </div>
                <h1 class="login-titulo">Biblioteca</h1>
            </div>
            <p class="login-subtitulo">Inicia sesión para administrar la biblioteca</p>

            <form id="form-login" autocomplete="on">
                <div class="campo">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" placeholder="admin" autocomplete="username" required>
                </div>
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>

                <div class="alerta" id="mensaje-error" role="alert"></div>

                <button type="submit" class="boton boton-primario boton-ancho" id="btn-login">
                    <span>Entrar</span>
                </button>
            </form>

            <p class="nota-creditos">
                Usuario por defecto: <code>admin</code> / <code>admin123</code>
            </p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
